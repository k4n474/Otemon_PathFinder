<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>T-mini Plus Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 18px 0 6px;
        }

        #status {
            min-height: 26px;
            margin-bottom: 10px;
            font-size: 17px;
        }

        #frontWallAlert {
            width: min(760px, 94vw);
            margin: 0 auto 12px;
            padding: 12px;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: #cbd5e1;
            font-size: 20px;
            font-weight: bold;
        }

        #frontWallAlert.detected {
            border-color: #ff3b30;
            background: #7f1d1d;
            color: white;
        }

        #sideWalls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            width: min(760px, 94vw);
            margin: 0 auto 12px;
        }

        .side-wall {
            padding: 12px;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #1e293b;
        }

        .side-wall.tracing {
            border-color: #22d3ee;
            background: #164e63;
        }

        .side-wall strong,
        .side-wall span {
            display: block;
        }

        .side-wall strong {
            margin-bottom: 6px;
            font-size: 18px;
        }

        .side-wall span {
            line-height: 1.5;
        }

        canvas {
            width: min(760px, 94vw);
            height: auto;
            background: #1b1b1b;
            border: 1px solid #555;
        }
    </style>
</head>

<body>
    <h1>T-mini Plus Live Viewer</h1>

    <div id="status">
        LiDAR APIへ接続中...
    </div>

    <div id="frontWallAlert">
        前方の壁: 未検出
    </div>

    <div id="sideWalls">
        <div id="leftWall" class="side-wall">
            <strong>左壁</strong>
            <span>None</span>
        </div>
        <div id="rightWall" class="side-wall">
            <strong>右壁</strong>
            <span>None</span>
        </div>
    </div>

    <canvas
        id="lidarCanvas"
        width="760"
        height="760"
    ></canvas>

    <script>
        // Live ServerがRaspberry Pi以外で動く場合は、
        // ?apiHost=192.168.x.x のようにLiDAR側のIPを指定する。
        const apiHost =
            new URLSearchParams(location.search).get("apiHost")
            || location.hostname
            || "localhost";

        const API_URL =
            `http://${apiHost}:5000/api/points`;

        const canvas =
            document.getElementById("lidarCanvas");

        const ctx =
            canvas.getContext("2d");

        const statusElement =
            document.getElementById("status");

        const frontWallAlert =
            document.getElementById("frontWallAlert");

        const leftWallElement =
            document.getElementById("leftWall");

        const rightWallElement =
            document.getElementById("rightWall");

        const centerX =
            canvas.width / 2;

        const centerY =
            canvas.height / 2;

        // 表示最大距離
        const MAXIMUM_DISTANCE = 3000;

        // 向きがずれる場合に変更
        const ANGLE_OFFSET = 0;

        // 左右が逆の場合はtrue
        const INVERT_ANGLE = false;

        const scale =
            (canvas.width / 2 - 30)
            / MAXIMUM_DISTANCE;

        let requesting = false;


        async function updateLidar() {
            if (requesting) {
                return;
            }

            requesting = true;

            try {
                const response = await fetch(
                    API_URL,
                    {
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                const data =
                    await response.json();

                if (!Array.isArray(data.points)) {
                    throw new Error(
                        "点群形式が不正です"
                    );
                }

                const walls =
                    Array.isArray(data.walls)
                    ? data.walls
                    : [];

                draw(data.points, walls);
                updateFrontWallAlert(data.front_wall);
                updateSideWalls(data.side_walls);

                statusElement.textContent =
                    `取得点数: ${data.count}`
                    + ` / 検出壁数: ${walls.length}`
                    + ` / API: ${apiHost}:5000`;

            } catch (error) {
                console.error(error);

                statusElement.textContent =
                    `接続エラー: ${error.message}`;
                frontWallAlert.textContent =
                    "前方の壁: 判定できません";
                frontWallAlert.classList.remove("detected");
                updateSideWalls(null);

            } finally {
                requesting = false;
            }
        }

        function updateFrontWallAlert(frontWall) {
            const distance =
                Number(frontWall?.front_distance);

            if (frontWall && Number.isFinite(distance)) {
                frontWallAlert.textContent =
                    `⚠ 前方に壁あり: ${Math.round(distance)} mm`;
                frontWallAlert.classList.add("detected");
                return;
            }

            frontWallAlert.textContent =
                "前方の壁: 未検出";
            frontWallAlert.classList.remove("detected");
        }

        function updateSideWalls(sideWalls) {
            const traceSide =
                sideWalls?.trace?.side ?? null;

            updateSideWall(
                leftWallElement,
                "左壁",
                sideWalls?.left,
                traceSide === "left"
            );
            updateSideWall(
                rightWallElement,
                "右壁",
                sideWalls?.right,
                traceSide === "right"
            );
        }

        function updateSideWall(
            element,
            label,
            wall,
            isTracing
        ) {
            if (!wall) {
                element.innerHTML =
                    `<strong>${label}</strong><span>None</span>`;
                element.classList.remove("tracing");
                return;
            }

            const distance =
                Math.round(Number(wall.wall_distance));
            const length =
                Math.round(Number(wall.length));
            const traceText =
                isTracing ? " / 追従候補" : "";

            element.innerHTML =
                `<strong>${label}${traceText}</strong>`
                + `<span>距離: ${distance} mm</span>`
                + `<span>長さ: ${length} mm</span>`;
            element.classList.toggle("tracing", isTracing);
        }


        function convertAngle(angle) {
            let converted = Number(angle);

            if (INVERT_ANGLE) {
                converted = -converted;
            }

            converted += ANGLE_OFFSET;

            converted %= 360;

            if (converted < 0) {
                converted += 360;
            }

            return converted;
        }


        function draw(points, walls) {
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawGrid();

            ctx.fillStyle = "#00ff88";

            for (const point of points) {
                const angle =
                    convertAngle(point.angle);

                const distance =
                    Number(point.distance);

                if (
                    !Number.isFinite(angle)
                    || !Number.isFinite(distance)
                ) {
                    continue;
                }

                if (
                    distance < 50
                    || distance > MAXIMUM_DISTANCE
                ) {
                    continue;
                }

                const radians =
                    angle * Math.PI / 180;

                const radius =
                    distance * scale;

                const x =
                    centerX
                    + Math.sin(radians)
                    * radius;

                const y =
                    centerY
                    - Math.cos(radians)
                    * radius;

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            drawWalls(walls);
            drawRobot();
        }


        function drawWalls(walls) {
            ctx.lineWidth = 5;
            ctx.lineCap = "round";

            for (const wall of walls) {
                if (!wall.start || !wall.end) {
                    continue;
                }

                const values = [
                    wall.start.x,
                    wall.start.y,
                    wall.end.x,
                    wall.end.y
                ].map(Number);

                if (!values.every(Number.isFinite)) {
                    continue;
                }

                const [startX, startY, endX, endY] =
                    values;

                ctx.strokeStyle =
                    wall.is_front_wall
                    ? "#ff3b30"
                    : "#ffcc00";
                ctx.lineWidth =
                    wall.is_front_wall
                    ? 8
                    : 5;

                ctx.beginPath();
                ctx.moveTo(
                    centerX + startX * scale,
                    centerY - startY * scale
                );
                ctx.lineTo(
                    centerX + endX * scale,
                    centerY - endY * scale
                );
                ctx.stroke();
            }

            ctx.lineCap = "butt";
        }


        function drawGrid() {
            ctx.strokeStyle = "#444";
            ctx.fillStyle = "#aaa";
            ctx.lineWidth = 1;
            ctx.font = "12px Arial";

            for (
                let distance = 500;
                distance <= MAXIMUM_DISTANCE;
                distance += 500
            ) {
                const radius =
                    distance * scale;

                ctx.beginPath();

                ctx.arc(
                    centerX,
                    centerY,
                    radius,
                    0,
                    Math.PI * 2
                );

                ctx.stroke();

                ctx.fillText(
                    `${distance} mm`,
                    centerX + 6,
                    centerY - radius + 14
                );
            }

            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();
        }


        function drawRobot() {
            ctx.fillStyle = "red";

            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                6,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.strokeStyle = "red";
            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.moveTo(
                centerX,
                centerY
            );

            ctx.lineTo(
                centerX,
                centerY - 30
            );

            ctx.stroke();
        }


        updateLidar();

        setInterval(
            updateLidar,
            100
        );
    </script>
</body>
</html>
